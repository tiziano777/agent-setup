
# Configuration for async_client.py
# Any key omitted falls back to the built-in default values.

# --- Server ---
# SGLang OpenAI-compatible chat completions endpoint.
API_URL: "http://127.0.0.1:8001/v1/chat/completions"
# MODEL_ID should match the model exposed by the SGLang server.
MODEL_ID: "velvet-2b-1.5_ba34086_t0"
MAX_NEW_TOKENS: 3072
TOP_P: 0.95
# Maximum times to retry a failing request (5xx or network errors)
MAX_RETRIES: 10
# Exponential backoff base in seconds (sleep = BACKOFF_FACTOR * 2**attempt)
BACKOFF_FACTOR: 0.5

# --- Input ---
RECIPE_PATH: "recipe.yaml"

# --- Output ---
# Raw JSONL inference records (per-entry subdirectory created automatically)
OUTPUT_BASE_DIR: "/nfs/data-download/dpo-inference/raw"
# Aggregated Parquet output — always a SEPARATE directory from raw JSONL
AGGREGATED_OUTPUT_DIR: "/nfs/data-download/dpo-inference/aggregated"
MAX_FILE_SIZE_MB: 100

# --- Inference ---
TEMPERATURE_RANGE: [0.0, 0.2, 0.3, 0.4, 0.5]
# Number of completions per request. n>1 → each choice stored as a separate record.
N: 1
# Stop sequences: string or list of up to 4 strings (null = disabled).
# STOP: null
# Token diversity penalties, range -2.0 to 2.0.
PRESENCE_PENALTY: 0.0
FREQUENCY_PENALTY: 0.0
# Fixed seed for reproducibility (null = non-deterministic).
# SEED: null
# Return token log-probabilities stored in _logprobs record field.
LOGPROBS: false
# Top-N log-probs per token (0-20), only relevant when LOGPROBS: true.
# TOP_LOGPROBS: null
# Output format: "text" (default) or "json_object".
RESPONSE_FORMAT: "text"
# Lower default concurrency for safer local testing; increase if your server
# and GPU can handle it.
CONCURRENT_REQUESTS: 128

# --- Schema mode: one of positive | negative | candidate ---
SCHEMA_MODE: "negative"

# --- Prompt assignment strategy: all | round_robin | random ---
PROMPT_STRATEGY: "random"

# --- Chat type mapping (default: modules/templates/chat_type_mapping.yml) ---
CHAT_TYPE_MAPPING_PATH: ./modules/templates/chat_type_mapping.yml
