
# Configuration for async_client.py
# Any key omitted falls back to the built-in default values.

# --- Server ---
# Use the native SGLang `/generate` endpoint by default to get explicit
# sampling params control. If you prefer the OpenAI-compatible chat endpoint
# set `API_URL` to `/v1/chat/completions` instead.
API_URL: "http://localhost:30000/generate"
# MODEL_ID should match the model exposed by the SGLang server. For local
# Velvet installs a good default is the model directory name (e.g. velvet-2b).
MODEL_ID: "velvet-2b"
MAX_NEW_TOKENS: 512
TOP_P: 0.95
TOP_K: 20
# Maximum times to retry a failing request (5xx or network errors)
MAX_RETRIES: 3
# Exponential backoff base in seconds (sleep = BACKOFF_FACTOR * 2**attempt)
BACKOFF_FACTOR: 0.5

# --- Input ---
RECIPE_PATH: "r2_recipe.yaml"

# --- Output ---
# Raw JSONL inference records (per-entry subdirectory created automatically)
OUTPUT_BASE_DIR: "output/raw"
# Aggregated Parquet output — always a SEPARATE directory from raw JSONL
AGGREGATED_OUTPUT_DIR: "output/aggregated"
MAX_FILE_SIZE_MB: 100

# --- Inference ---
TEMPERATURE_RANGE: [0.0, 0.2, 0.3, 0.4, 0.5]
# Lower default concurrency for safer local testing; increase if your server
# and GPU can handle it.
CONCURRENT_REQUESTS: 32

# --- Schema mode: one of positive | negative | candidate ---
SCHEMA_MODE: "negative"

# --- Prompt assignment strategy: all | round_robin | random ---
PROMPT_STRATEGY: "random"

# --- Chat type mapping (default: modules/templates/dpo/chat_type_mapping.yml) ---
# CHAT_TYPE_MAPPING_PATH: "/absolute/path/to/chat_type_mapping.yml"

# --- Endpoint selection ---
# false (default): POST to /generate with {"text": "..."} — native SGLang,
#                  full sampling_params control (top_k, top_p, max_new_tokens).
# true:            POST to /v1/chat/completions with {"messages": [...]} —
#                  OpenAI-compatible, messages passed as-is (no text conversion).
USE_CHAT_COMPLETIONS_API: false
